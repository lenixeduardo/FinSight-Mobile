name: FinSight Flutter - SDK e validacao

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finsight-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Flutter SDK, analyze e widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter e Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versoes e diagnostico
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Dependencias
        run: flutter pub get

      - name: Analise Dart e Flutter
        run: flutter analyze

      - name: Testes de widget
        run: flutter test --reporter expanded

      - name: Resumo
        if: always()
        run: |
          echo '## FinSight — verificacao de infraestrutura' >> "$GITHUB_STEP_SUMMARY"
          echo 'SDK Flutter/Dart, analise estatica e testes do app inicial.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Esta execução valida o aplicativo navegável; a nota visual exige comparação das capturas com a prancha V5.' >> "$GITHUB_STEP_SUMMARY"

  build-web:
    name: Build de preview Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar suporte web no projeto
        run: flutter create --platforms=web --project-name finsight_mobile .

      - name: Dependencias
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Artefato de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finsight-flutter-web-preview
          path: build/web/
          if-no-files-found: warn
          retention-days: 14

  visual-captures:
    name: Capturas Flutter V5.3 (render widget)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Capturar 390 e 320 dp
        run: flutter test test/visual_capture_test.dart --reporter expanded
      - name: Publicar imagens reais do Flutter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finsight-flutter-v53-captures
          path: captures/flutter_v53/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar instrucoes para auditoria
        if: always()
        run: |
          echo '## Capturas Flutter V5.3' >> "$GITHUB_STEP_SUMMARY"
          echo 'Imagens de widget renderizadas em Linux: nao equivalem a capturas iOS/Android.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compare proporcoes, logos, tipografia e cores com o mockup V5 usando a mesma viewport.' >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pasta nativa Android
        run: flutter create --platforms=android --project-name finsight_mobile .
      - name: Instalar dependencias
        run: flutter pub get
      - name: Compilar APK demonstrativo
        run: flutter build apk --debug
      - name: Publicar APK de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finsight-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
