name: FinSight - producao e API smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar aplicação Web e cotações reais da brapi
        env:
          FINSIGHT_BASE_URL: https://finsight-three-iota.vercel.app
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["FINSIGHT_BASE_URL"].rstrip("/")
          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "FinSight-MVP-Smoke/1.0",
                  "Accept": "application/json, text/html",
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, response.read(300000).decode("utf-8", "replace")

          last_error = ""
          for attempt in range(1, 16):
              try:
                  status, html = get(base + "/")
                  assert status == 200, "Página inicial não retornou HTTP 200"
                  assert "<html" in html.lower(), "Página inicial não contém HTML"
                  status, body = get(base + "/api/quotes")
                  assert status == 200, "API de cotações não retornou HTTP 200"
                  payload = json.loads(body)
                  results = payload.get("results")
                  assert isinstance(results, list), "Resposta da API sem lista de resultados"
                  quotes = {r.get("symbol"): r for r in results if isinstance(r, dict)}
                  for ticker in ("PETR4", "VALE3", "ITUB4", "MGLU3"):
                      assert ticker in quotes, f"Cotação ausente: {ticker}"
                      quote = quotes[ticker]
                      assert isinstance(quote.get("regularMarketPrice"), (int, float)) and quote["regularMarketPrice"] > 0, f"Preço inválido: {ticker}"
                      assert isinstance(quote.get("regularMarketChangePercent"), (int, float)), f"Variação inválida: {ticker}"
                      assert isinstance(quote.get("historicalDataPrice"), list), f"Histórico ausente: {ticker}"
                  assert "BRAPI_TOKEN" not in body and "Bearer " not in body, "API pode estar expondo informação de autenticação"
                  print("PASS: site responde HTTP 200")
                  print("PASS: /api/quotes retornou cotações válidas para quatro ativos")
                  print("PASS: payload não contém variável ou cabeçalho de autenticação")
                  break
              except Exception as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
                  print(f"Tentativa {attempt}/15: {last_error}")
                  if attempt == 15:
                      raise SystemExit("FAIL: smoke test de produção não passou: " + last_error)
                  time.sleep(20)
          PY
